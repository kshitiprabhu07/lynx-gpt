services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5432:5432"]        # dev only — remove for the final demo topology
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10
    networks: [lynx]

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports: ["6379:6379"]        # dev only — remove for the final demo topology
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    networks: [lynx]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - miniodata:/data
    ports: ["9001:9001"]
    networks: [lynx]

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686", "4317:4317"]
    networks: [lynx]

  api:
    build: .
    environment:
      REDIS_URL_LOCAL: redis://redis:6379/0
      POSTGRES_DSN_LOCAL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
    networks: [lynx]

  admin:
    build: .
    command: ["uvicorn", "admin.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      REDIS_URL_LOCAL: redis://redis:6379/0
      POSTGRES_DSN_LOCAL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
    networks: [lynx]

  nginx:
    image: nginx:alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["8080:80"]
    depends_on: [api, admin]
    networks: [lynx]

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  lynx:
    driver: bridge